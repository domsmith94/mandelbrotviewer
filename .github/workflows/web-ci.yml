name: Web CI

on:
  pull_request:
    paths: ['web/**', 'java/**', '.github/workflows/web-*.yml']
  push:
    branches: [master, main]
    paths: ['web/**', 'java/**', '.github/workflows/web-*.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Golden fixture is up to date with the Java implementation
        run: npm run golden && git diff --exit-code src/fractal/__fixtures__/java-golden.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
