name: Web CI

on:
  pull_request:
    paths: ['web/**', 'java/**', '.github/workflows/web-*.yml']
  push:
    branches: [master, main]
    paths: ['web/**', 'java/**', '.github/workflows/web-*.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Golden fixture is up to date with the Java implementation
        run: npm run golden && git diff --exit-code src/fractal/__fixtures__/java-golden.json
      - run: npm run lint
      - run: npm test
      - run: npm run build
